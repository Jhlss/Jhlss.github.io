<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgJ" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1f"/>
      <stop offset="55%" stop-color="#10182f"/>
      <stop offset="100%" stop-color="#161f3d"/>
    </linearGradient>

    <!-- Flow gradient built from Julia's own brand colors -->
    <linearGradient id="flowJ" x1="5%" y1="0%" x2="95%" y2="100%">
      <stop offset="0%" stop-color="#CB3C33"/>
      <stop offset="50%" stop-color="#9558B2"/>
      <stop offset="100%" stop-color="#389826"/>
    </linearGradient>
    <linearGradient id="flowJ2" x1="95%" y1="0%" x2="5%" y2="100%">
      <stop offset="0%" stop-color="#389826"/>
      <stop offset="55%" stop-color="#9558B2"/>
      <stop offset="100%" stop-color="#CB3C33"/>
    </linearGradient>

    <radialGradient id="haloJ" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9558B2" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#389826" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="glowJ" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bgJ)"/>
  <ellipse cx="640" cy="330" rx="480" ry="330" fill="url(#haloJ)"/>

  <!-- Quiet phase-space axes -->
  <g stroke="#c8d6f5" stroke-width="0.8" opacity="0.25">
    <line x1="120" y1="560" x2="1120" y2="560"/>
    <line x1="120" y1="560" x2="120" y2="90"/>
  </g>
  <g fill="#c8d6f5" opacity="0.25">
    <path d="M 1120 560 l -8 -4 v 8 z"/>
    <path d="M 120 90 l -4 8 h 8 z"/>
  </g>

  <!-- Faint scattered points -->
  <g fill="#dbe4ff" opacity="0.25">
    <circle cx="1140" cy="120" r="1.3"/>
    <circle cx="90" cy="600" r="1.3"/>
  </g>

  <!-- CENTERPIECE: chaotic flow / strange attractor, colored in Julia's palette -->
  <g filter="url(#glowJ)">
    <path d="M 380 250
             C 300 290, 288 400, 365 452
             C 440 502, 540 480, 560 405
             C 576 350, 538 306, 482 316
             C 438 324, 422 370, 454 397
             C 486 422, 536 408, 552 364
             C 572 306, 534 244, 468 234
             C 392 222, 336 268, 348 332"
          fill="none" stroke="url(#flowJ)" stroke-width="4.2" stroke-linecap="round" opacity="0.95"/>

    <path d="M 630 415
             C 700 468, 800 456, 844 390
             C 886 326, 854 250, 776 240
             C 720 232, 682 268, 693 316
             C 702 354, 748 370, 780 342
             C 812 314, 800 262, 750 250
             C 690 238, 642 284, 658 344"
          fill="none" stroke="url(#flowJ2)" stroke-width="4.2" stroke-linecap="round" opacity="0.95"/>

    <path d="M 560 405 C 585 428, 615 428, 630 415" fill="none" stroke="#9558B2" stroke-width="3.2" opacity="0.9" stroke-linecap="round"/>
  </g>

  <!-- Julia's iconic three dots, integrated as a real accent -->
  <g filter="url(#glowJ)">
    <circle cx="960" cy="520" r="13" fill="#CB3C33"/>
    <circle cx="996" cy="520" r="13" fill="#389826"/>
    <circle cx="978" cy="490" r="13" fill="#9558B2"/>
  </g>

  <!-- Small terminal panel with a real Julia dynamical-systems snippet -->
  <g>
    <rect x="120" y="470" width="330" height="130" rx="10" fill="#0d1428" stroke="#2a3b66" stroke-width="1" opacity="0.9"/>
    <circle cx="140" cy="490" r="4" fill="#CB3C33"/>
    <circle cx="155" cy="490" r="4" fill="#f4c869"/>
    <circle cx="170" cy="490" r="4" fill="#389826"/>
    <g font-family="'Courier New', monospace" font-size="13.5" fill="#c8d6f5">
      <text x="140" y="518">function lorenz(u, p, t)</text>
      <text x="152" y="536"><tspan fill="#7dd3fc">x, y, z</tspan> = u</text>
      <text x="152" y="554">ẋ = 10.0(y - x)</text>
      <text x="152" y="572">ẏ = x*(28.0 - z) - y</text>
      <text x="140" y="590">end</text>
    </g>
  </g>
</svg>
